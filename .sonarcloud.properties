# Analysis scope for SonarQube Cloud.
#
# This is the Automatic Analysis configuration file, and it is only read from the default
# branch -- a change here takes effect once it is merged to master, not on the pull request
# that introduces it.

# The NUKE bootstrap scripts are generated by the Nuke global tool, not written by hand, so
# the shell and PowerShell conventions Sonar reports on them (`Param` casing, `!` vs `-not`,
# `[` vs `[[`, snake_case function names) are not ours to fix -- regenerating the build would
# only bring them back.
sonar.exclusions=build.ps1,build.sh
